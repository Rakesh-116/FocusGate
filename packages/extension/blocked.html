<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FocusGate Blocked</title>
        <style>
            :root {
                color-scheme: dark;
                --bg-a: #0a0a14;
                --bg-b: #0d0d1f;
                --bg-c: #120820;
                --panel: rgba(15, 23, 42, 0.74);
                --panel-border: rgba(148, 163, 184, 0.12);
                --sub-panel: rgba(2, 6, 23, 0.78);
                --text: #f8fafc;
                --muted: #94a3b8;
                --accent: #8b5cf6;
                --accent-strong: #ec4899;
                --success: #34d399;
                --danger: #fb7185;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: "Segoe UI", sans-serif;
                background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
                color: var(--text);
            }

            button,
            textarea {
                font: inherit;
            }

            .shell {
                width: min(90vw, 1600px);
                margin: 0 auto;
                padding: 24px 18px 36px;
            }

            .panel {
                border: 1px solid var(--panel-border);
                background: var(--panel);
                border-radius: 28px;
                backdrop-filter: blur(20px);
                box-shadow: 0 24px 90px rgba(2, 6, 23, 0.42);
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 16px;
                padding: 20px;
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 0.28em;
                text-transform: uppercase;
                color: var(--muted);
            }

            .blocked-url {
                margin-top: 10px;
                color: #dbe4f0;
                word-break: break-word;
            }

            .actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .button {
                border: 1px solid rgba(148, 163, 184, 0.22);
                background: rgba(15, 23, 42, 0.95);
                color: var(--text);
                border-radius: 999px;
                padding: 10px 16px;
                cursor: pointer;
                font-weight: 700;
            }

            .button-primary {
                border: none;
                background: linear-gradient(90deg, var(--accent) 0%, var(--accent-strong) 100%);
            }

            .stack {
                display: grid;
                gap: 18px;
                margin-top: 18px;
            }

            .main-grid {
                display: grid;
                gap: 18px;
                grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
                align-items: start;
            }

            .hero-panel,
            .quote-panel,
            .tasks-panel,
            .bottom-panel {
                padding: 24px;
            }

            .hero-panel {
                display: grid;
                gap: 18px;
                min-height: 520px;
            }

            .carousel {
                position: relative;
                width: 100%;
                overflow: hidden;
                display: grid;
                gap: 16px;
                min-height: 100%;
            }

            .carousel-viewport {
                overflow: hidden;
                min-height: 460px;
                border-radius: 28px;
            }

            .carousel-track {
                display: flex;
                width: 100%;
                height: 100%;
                transition: transform 0.35s ease;
                will-change: transform;
            }

            .carousel-slide {
                flex: 0 0 100%;
                width: 100%;
                display: block;
                min-height: 460px;
            }

            .carousel-nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: 44px;
                height: 44px;
                border-radius: 999px;
                border: 1px solid rgba(148, 163, 184, 0.18);
                background: rgba(15, 23, 42, 0.82);
                color: var(--text);
                display: grid;
                place-items: center;
                cursor: pointer;
                z-index: 1;
            }

            .carousel-prev {
                left: 14px;
            }

            .carousel-next {
                right: 14px;
            }

            .carousel-nav:hover {
                background: rgba(139, 92, 246, 0.9);
            }

            .carousel-dots {
                display: grid;
                grid-auto-flow: column;
                justify-content: center;
                gap: 10px;
                margin-top: 16px;
            }

            .carousel-dot {
                width: 12px;
                height: 12px;
                border-radius: 999px;
                border: 1px solid rgba(148, 163, 184, 0.3);
                background: transparent;
                cursor: pointer;
            }

            .carousel-dot.active {
                background: var(--accent);
                border-color: var(--accent);
            }

            .hero-image {
                position: relative;
                width: 100%;
                height: 460px;
                overflow: hidden;
                border-radius: 28px;
                background: rgba(15, 23, 42, 0.5);
                border: 1px solid rgba(148, 163, 184, 0.14);
            }

            .hero-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .hero-caption {
                position: absolute;
                inset-inline: 0;
                bottom: 0;
                padding: 22px;
                background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.78) 100%);
                font-weight: 700;
                font-size: 1.15rem;
            }

            .hero-empty {
                display: grid;
                place-items: center;
                min-height: 100%;
                text-align: center;
                color: var(--muted);
                font-size: 1rem;
                border: 2px dashed rgba(148, 163, 184, 0.2);
                border-radius: 28px;
                padding: 24px;
                background: rgba(2, 6, 23, 0.8);
            }

            .quote-panel,
            .tasks-panel {
                border-radius: 28px;
                background: var(--panel);
                border: 1px solid var(--panel-border);
                box-shadow: 0 24px 90px rgba(2, 6, 23, 0.12);
            }

            .bottom-panel {
                border-radius: 28px;
                background: var(--panel);
                border: 1px solid var(--panel-border);
                box-shadow: 0 24px 90px rgba(2, 6, 23, 0.12);
            }

            .quote {
                text-align: center;
                font-size: clamp(1.4rem, 2.8vw, 2rem);
                line-height: 1.5;
                font-style: italic;
                color: rgba(248, 250, 252, 0.94);
            }

            .quote-author {
                margin-top: 18px;
                text-align: center;
                color: #c4b5fd;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                font-size: 12px;
                font-weight: 700;
            }

            .section-title {
                margin: 0;
                font-size: clamp(1.4rem, 2.5vw, 2rem);
            }

            .section-copy {
                margin-top: 10px;
                color: var(--muted);
            }

            .task-list {
                display: grid;
                gap: 12px;
                margin-top: 18px;
                max-height: 320px;
                overflow-y: auto;
                padding-right: 4px;
            }

            .task-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                border: 1px solid rgba(148, 163, 184, 0.1);
                background: var(--sub-panel);
                border-radius: 22px;
                padding: 16px;
            }

            .task-button {
                display: flex;
                align-items: center;
                gap: 14px;
                border: none;
                background: transparent;
                color: inherit;
                cursor: pointer;
                text-align: left;
                padding: 0;
            }

            .checkbox {
                width: 26px;
                height: 26px;
                border-radius: 12px;
                border: 1px solid rgba(148, 163, 184, 0.34);
                display: grid;
                place-items: center;
                color: transparent;
            }

            .checkbox.checked {
                background: var(--success);
                border-color: var(--success);
                color: #03231a;
                font-weight: 900;
            }

            .task-complete {
                color: var(--success);
                text-transform: uppercase;
                letter-spacing: 0.18em;
                font-size: 11px;
                font-weight: 700;
            }

            .empty {
                border: 1px dashed rgba(148, 163, 184, 0.18);
                background: rgba(15, 23, 42, 0.45);
                border-radius: 22px;
                padding: 20px;
                color: var(--muted);
            }

            .cards {
                display: grid;
                gap: 14px;
                margin-top: 18px;
            }

            .vision-card {
                position: relative;
                min-height: 260px;
                overflow: hidden;
                border-radius: 24px;
                background: #020617;
                border: 1px solid rgba(148, 163, 184, 0.12);
            }

            .vision-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .vision-caption {
                position: absolute;
                inset-inline: 0;
                bottom: 0;
                padding: 18px;
                background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.78) 100%);
                font-weight: 700;
            }

            .hero-row {
                display: grid;
                gap: 18px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .right-grid {
                display: grid;
                gap: 18px;
            }

            @media (max-width: 980px) {
                .main-grid {
                    grid-template-columns: 1fr;
                }

                .hero-row {
                    grid-template-columns: 1fr;
                }

                .quote-panel,
                .tasks-panel,
                .bottom-panel,
                .hero-panel {
                    min-height: auto;
                }
            }

            .bypass-panel {
                display: grid;
                gap: 14px;
                margin-top: 18px;
            }

            .bypass-inner {
                border: 1px solid rgba(148, 163, 184, 0.1);
                background: var(--sub-panel);
                border-radius: 22px;
                padding: 18px;
            }

            .countdown {
                font-weight: 700;
                color: #ddd6fe;
            }

            textarea {
                width: 100%;
                min-height: 120px;
                border-radius: 20px;
                border: 1px solid rgba(148, 163, 184, 0.18);
                background: rgba(2, 6, 23, 0.95);
                color: var(--text);
                padding: 14px;
                resize: vertical;
            }

            .error {
                color: var(--danger);
                font-size: 14px;
            }

            .success-banner {
                margin-top: 18px;
                border-radius: 24px;
                background: rgba(52, 211, 153, 0.14);
                color: var(--success);
                padding: 16px;
                text-align: center;
                font-weight: 700;
            }

            .loading-shell,
            .setup-shell {
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 18px;
            }

            .setup-card {
                width: min(640px, 100%);
                padding: 28px;
            }

            .muted {
                color: var(--muted);
            }

            .u-mt-10 {
                margin-top: 10px;
            }

            .u-mt-12 {
                margin-top: 12px;
            }

            .u-mt-14 {
                margin-top: 14px;
            }

            .u-mt-18 {
                margin-top: 18px;
            }

            .u-mt-20 {
                margin-top: 20px;
            }

            .bypass-label {
                display: block;
                margin-top: 14px;
                margin-bottom: 8px;
            }

            @media (max-width: 980px) {
                .hero-panel {
                    min-height: auto;
                }

                .carousel-viewport,
                .carousel-slide,
                .hero-image {
                    min-height: 320px;
                    height: 320px;
                }
            }

            @media (max-width: 640px) {
                .shell {
                    padding: 18px 14px 28px;
                }

                .header {
                    flex-direction: column;
                    align-items: stretch;
                }

                .actions {
                    width: 100%;
                }

                .actions .button {
                    flex: 1 1 0;
                    text-align: center;
                }

                .carousel-nav {
                    width: 40px;
                    height: 40px;
                }

                .carousel-viewport,
                .carousel-slide,
                .hero-image {
                    min-height: 260px;
                    height: 260px;
                }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="blocked.js"></script>
    </body>
</html>
