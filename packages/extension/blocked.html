<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blocked - FocusGate</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family: "Segoe UI", sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
                color: #e5e7eb;
            }

            .container {
                width: min(560px, 100%);
                border: 1px solid rgba(148, 163, 184, 0.14);
                background: rgba(15, 23, 42, 0.9);
                border-radius: 28px;
                padding: 32px;
                text-align: center;
                box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
            }

            .icon {
                font-size: 68px;
                margin-bottom: 18px;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 12px;
            }

            p {
                color: #94a3b8;
                line-height: 1.6;
            }

            .rule {
                margin: 18px 0 12px;
                padding: 12px 16px;
                border-radius: 14px;
                background: rgba(139, 92, 246, 0.16);
                color: #ddd6fe;
                word-break: break-word;
            }

            .url {
                margin: 0 0 22px;
                font-size: 0.95rem;
            }

            .buttons {
                display: flex;
                gap: 12px;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 24px;
            }

            button {
                border: none;
                border-radius: 999px;
                padding: 14px 20px;
                font-weight: 700;
                cursor: pointer;
            }

            .primary {
                background: linear-gradient(90deg, #8b5cf6 0%, #ec4899 100%);
                color: white;
            }

            .secondary {
                background: #1e293b;
                color: #e5e7eb;
            }
        </style>
    </head>
    <body>
        <main class="container">
            <div class="icon">🧠</div>
            <h1>Stay with the task in front of you.</h1>
            <p>FocusGate is blocking this page because you still have pending tasks for today.</p>
            <div class="rule" id="blockedRule">Blocked prefix</div>
            <p class="url" id="blockedUrl">Attempted URL</p>
            <div class="buttons">
                <button id="goBackBtn" class="primary">Go Back</button>
                <button id="openAppBtn" class="secondary">Open FocusGate</button>
            </div>
        </main>

        <script src="blocked.js"></script>
    </body>
</html>
